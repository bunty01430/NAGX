[workspace]
resolver = "2"
members = [
    "crates/nagx-core",
    "crates/nagx-model",
    "crates/nagx-protocol",
    "crates/nagx-terminal",
    "crates/nagx-session",
    "crates/nagx-config",
    "apps/nagd",
    "apps/nagx-tui",
    "clients/nagx-connect",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
repository = "https://github.com/bunty01430/NAGX"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
